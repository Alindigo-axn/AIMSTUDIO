<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#c8f53c" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#c8f53c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c8f53c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#c8f53c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c8f53c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="#0a0a09"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>

  <!-- top hairline -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#lineFade)"/>
  <rect x="0" y="359" width="1200" height="1" fill="url(#lineFade)"/>

  <!-- badge -->
  <g transform="translate(600,72)">
    <rect x="-118" y="-16" width="236" height="32" rx="16" fill="#c8f53c" fill-opacity="0.06" stroke="#c8f53c" stroke-opacity="0.28"/>
    <circle cx="-96" cy="0" r="3" fill="#c8f53c"/>
    <text x="-84" y="4.5" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5" fill="#c8f53c" fill-opacity="0.85">DIGITAL STUDIO · SINCE 2019</text>
  </g>

  <!-- headline -->
  <text x="600" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="300" font-size="64" letter-spacing="-1.5" fill="#ececf0">AIM <tspan fill="#c8f53c" font-style="italic">Studio</tspan></text>

  <!-- subline -->
  <text x="600" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="300" font-size="15" letter-spacing="0.3" fill="#8b8b95">Web &#183; UI/UX &#183; Mobile &#183; Brand &#183; SEO &#183; AI Integrations</text>

  <!-- divider -->
  <rect x="440" y="238" width="320" height="1" fill="#ffffff" fill-opacity="0.1"/>

  <!-- feature pills -->
  <g font-family="JetBrains Mono, monospace" font-size="10.5" letter-spacing="1" fill="#6b6b78">
    <g transform="translate(600,268)">
      <text text-anchor="middle">EN</text>
    </g>
  </g>

  <g transform="translate(330,270)">
    <rect x="0" y="-14" width="86" height="28" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="43" y="4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1" fill="#9a9aa3">HTML / CSS</text>
  </g>
  <g transform="translate(430,270)">
    <rect x="0" y="-14" width="70" height="28" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="35" y="4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1" fill="#9a9aa3">VANILLA JS</text>
  </g>
  <g transform="translate(514,270)">
    <rect x="0" y="-14" width="94" height="28" rx="14" fill="#c8f53c" fill-opacity="0.08" stroke="#c8f53c" stroke-opacity="0.3"/>
    <text x="47" y="4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1" fill="#c8f53c">EN &#183; RU &#183; KZ</text>
  </g>
  <g transform="translate(622,270)">
    <rect x="0" y="-14" width="80" height="28" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="40" y="4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1" fill="#9a9aa3">ONE FILE</text>
  </g>
  <g transform="translate(716,270)">
    <rect x="0" y="-14" width="110" height="28" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="55" y="4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1" fill="#9a9aa3">NO BUILD STEP</text>
  </g>

  <!-- corner marks -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2">
    <path d="M28 28 L28 48 M28 28 L48 28"/>
    <path d="M1172 28 L1172 48 M1172 28 L1152 28"/>
    <path d="M28 332 L28 312 M28 332 L48 332"/>
    <path d="M1172 332 L1172 312 M1172 332 L1152 332"/>
  </g>
</svg>
